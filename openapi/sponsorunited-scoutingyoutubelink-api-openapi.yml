openapi: 3.2.0
info:
  title: SponsorUnited Scouting Youtube Link API
  version: v1
  description: ScoutingYoutubeLink
tags:
- name: ScoutingYoutubeLink
  description: ScoutingYoutubeLink
paths:
  /api/user/{user_id}/event/{event_id}/property/{property_id}/youtube-links:
    get:
      tags:
      - ScoutingYoutubeLink
      summary: List scouting YouTube links
      description: Returns all YouTube links associated with a user's scouting event for a specific property
      operationId: f37e57ce3931072c428b34c3e1019ea4
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: An array of scouting YouTube links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoutingYoutubeLinkResource'
      security:
      - bearerAuth: []
    post:
      tags:
      - ScoutingYoutubeLink
      summary: Create scouting YouTube link
      description: Adds a new YouTube link to a user's scouting event for a specific property
      operationId: fbf9d05c4a9df0c3785de2a173c2352a
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoutingYoutubeLinkStoreRequest'
      responses:
        '201':
          description: YouTube link created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoutingYoutubeLinkResource'
      security:
      - bearerAuth: []
  /api/user/{user_id}/event/{event_id}/property/{property_id}/youtube-links/{youtube_link_id}:
    put:
      tags:
      - ScoutingYoutubeLink
      summary: Update scouting YouTube link
      description: Updates an existing YouTube link URL for a user's scouting event
      operationId: 8ba473a8031b2e2b3861ef41461309ba
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      - name: youtube_link_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoutingYoutubeLinkUpdateRequest'
      responses:
        '200':
          description: YouTube link updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoutingYoutubeLinkResource'
      security:
      - bearerAuth: []
    delete:
      tags:
      - ScoutingYoutubeLink
      summary: Delete scouting YouTube link
      description: Removes a YouTube link from a user's scouting event for a specific property
      operationId: 0cc8ce3838092a4c4edae7fdee1dbcfe
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
      - name: property_id
        in: path
        required: true
        schema:
          type: integer
      - name: youtube_link_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: YouTube link deleted successfully.
      security:
      - bearerAuth: []
components:
  schemas:
    ScoutingYoutubeLinkResource:
      properties:
        id:
          description: YouTube link ID
          type: integer
          example: 1
        youtube_url:
          description: YouTube URL
          type: string
          example: https://www.youtube.com/watch?v=dQw4w9WgXcQ
        user_event_id:
          description: User Event ID
          type: integer
          example: 123
        created_at:
          description: Creation timestamp
          type: string
          format: date-time
          example: '2023-01-01T12:00:00.000000Z'
        updated_at:
          description: Last update timestamp
          type: string
          format: date-time
          example: '2023-01-01T12:00:00.000000Z'
        deleted_at:
          description: Soft delete timestamp
          type: string
          format: date-time
          example: null
      type: object
    ScoutingYoutubeLinkStoreRequest:
      required:
      - youtube_url
      properties:
        youtube_url:
          description: YouTube URL
          type: string
          example: https://www.youtube.com/watch?v=dQw4w9WgXcQ
      type: object
    ScoutingYoutubeLinkUpdateRequest:
      required:
      - youtube_url
      properties:
        youtube_url:
          description: YouTube URL
          type: string
          example: https://www.youtube.com/watch?v=dQw4w9WgXcQ
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      name: JWT Authentication
      in: header
      bearerFormat: JWT
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      description: 'Service API key for external services (ai-api, chat-api). Generate with: php artisan su:api-token:generate'
      name: X-API-Key
      in: header
