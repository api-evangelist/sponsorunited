openapi: 3.2.0
info:
  title: SponsorUnited YouTube Brand Assets API
  version: v1
  description: YouTube Brand Assets
tags:
- name: YouTube Brand Assets
  description: YouTube Brand Assets
paths:
  /api/youtube-brand-assets-combination/{userEvent}:
    get:
      tags:
      - YouTube Brand Assets
      summary: Get brand-asset combinations for a YouTube scouting event
      description: Retrieves all detected brand-asset combinations for a given scouting event from YouTube video processing
      operationId: 1cd62c0bed197799e56b1eb7797a9f12
      parameters:
      - name: userEvent
        in: path
        description: User event ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: List of brand-asset combinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/YoutubeBrandAssetCombinationResource'
        '404':
          description: Scouting event not found
      security:
      - bearerAuth: []
components:
  schemas:
    YoutubeBrandAssetCombinationResource:
      properties:
        brand_name:
          description: Brand name
          type: string
          example: Nike
        asset_name:
          description: Asset name
          type: string
          example: Jersey Sleeve Logo
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      name: JWT Authentication
      in: header
      bearerFormat: JWT
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      description: 'Service API key for external services (ai-api, chat-api). Generate with: php artisan su:api-token:generate'
      name: X-API-Key
      in: header
