openapi: 3.2.0
info:
  title: SponsorUnited Feedback API
  version: v1
  description: Feedback
tags:
- name: Feedback
  description: Feedback
paths:
  /api/send-feedback:
    post:
      tags:
      - Feedback
      summary: Send user feedback
      description: Sends feedback from the authenticated user via email to the SponsorUnited support team
      operationId: 5ce25b7a9773b85e2ca31cc499eb5436
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSendRequest'
      responses:
        '200':
          description: Feedback sent successfully
      security:
      - bearerAuth: []
components:
  schemas:
    FeedbackSendRequest:
      properties:
        email_body:
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      name: JWT Authentication
      in: header
      bearerFormat: JWT
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      description: 'Service API key for external services (ai-api, chat-api). Generate with: php artisan su:api-token:generate'
      name: X-API-Key
      in: header
