          type: integer
        default_user_subscription_plan_id:
          type: string
        default_user_subscription_product_name:
          type: string
        default_user_subscription_cancel_date:
          type: string
          format: date-time
        user_email_domain:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
      type: object
    UserProfileUpdateRequest:
      required:
      - name
      - email
      - id
      properties:
        name:
          type: string
        avatar:
          type: string
        email:
          type: email
        phone:
          type: string
        work_phone:
          type: string
        email_status:
          type: string
        email_status_updated:
          type: boolean
        manual_email_status:
          type: string
        manual_email_status_updated_at:
          type: string
          format: date-time
        linkedin:
          type: string
        facebook:
          type: string
        twitter:
          type: string
        instagram:
          type: string
        id:
          type: integer
      type: object
    PersonProfileSocialDetail:
      properties:
        id:
          type: integer
        person_profile_id:
          type: integer
        linkedin_profile_url:
          type: string
        facebook_profile_url:
          type: string
        twitter_profile_url:
          type: string
        instagram_profile_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
      type: object
    UserDownloadFileResource:
      properties:
        status:
          type: string
        url:
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      name: JWT Authentication
      in: header
      bearerFormat: JWT
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      description: 'Service API key for external services (ai-api, chat-api). Generate with: php artisan su:api-token:generate'
      name: X-API-Key
      in: header
