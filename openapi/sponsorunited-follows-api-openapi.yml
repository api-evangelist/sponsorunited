openapi: 3.2.0
info:
  title: SponsorUnited Follows API
  version: v1
  description: Follows
tags:
- name: Follows
  description: Follows
paths:
  /api/follows:
    post:
      tags:
      - Follows
      summary: Follow one or more entities
      description: Upserts follow relationships for the authenticated user. Duplicate or already-followed entries are silently ignored. Validates that every ULID exists in its entity table; returns 422 with a list of unknown ULIDs otherwise.
      operationId: b51b60ea8fc7dec0803ae92a4530c977
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - follows
              properties:
                follows:
                  type: array
                  items:
                    required:
                    - entity_type
                    - entity_ulid
                    properties:
                      entity_type:
                        type: string
                        enum:
                        - brand
                        - property
                        - agency
                        example: brand
                      entity_ulid:
                        description: 26-character ULID of the entity
                        type: string
                        maxLength: 26
                        minLength: 26
                        example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: object
                  maxItems: 100
                  minItems: 1
              type: object
      responses:
        '200':
          description: Follows created (or silently de-duplicated).
        '401':
          description: Unauthenticated.
        '422':
          description: Validation error — unknown entity_type, malformed ULID, or ULID not found in the entity table.
      security:
      - bearerAuth: []
    delete:
      tags:
      - Follows
      summary: Unfollow one or more entities
      description: Removes follow relationships for the authenticated user. Entries that were never followed are silently ignored (idempotent).
      operationId: 69ef442f3509964dd78fead1e3ec3a2e
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - follows
              properties:
                follows:
                  type: array
                  items:
                    required:
                    - entity_type
                    - entity_ulid
                    properties:
                      entity_type:
                        type: string
                        enum:
                        - brand
                        - property
                        - agency
                        example: brand
                      entity_ulid:
                        type: string
                        maxLength: 26
                        minLength: 26
                        example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: object
                  maxItems: 100
                  minItems: 1
              type: object
      responses:
        '204':
          description: Unfollowed successfully (no content).
        '401':
          description: Unauthenticated.
        '422':
          description: Validation error — unknown entity_type or malformed ULID.
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      name: JWT Authentication
      in: header
      bearerFormat: JWT
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      description: 'Service API key for external services (ai-api, chat-api). Generate with: php artisan su:api-token:generate'
      name: X-API-Key
      in: header
