openapi: 3.2.0
info:
  title: SponsorUnited AI Chatbot API
  version: v1
  description: AI Chatbot
tags:
- name: AI Chatbot
  description: AI Chatbot
paths:
  /api/ai-chatbot/access:
    get:
      tags:
      - AI Chatbot
      summary: Get AI chatbot access token
      description: Generates or retrieves an access token for the AI chatbot service. Requires the user to have AI chatbot access permissions
      operationId: db297135cc617e1f4ea5407ef93e0343
      responses:
        '200':
          description: Generate or retrieve the AI Chatbot access token.
          content:
            application/json:
              schema:
                properties:
                  access_token:
                    type: string
                type: object
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      name: JWT Authentication
      in: header
      bearerFormat: JWT
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      description: 'Service API key for external services (ai-api, chat-api). Generate with: php artisan su:api-token:generate'
      name: X-API-Key
      in: header
