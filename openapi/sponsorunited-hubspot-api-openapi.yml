openapi: 3.2.0
info:
  title: SponsorUnited Hubspot API
  version: v1
  description: Hubspot
tags:
- name: Hubspot
  description: Hubspot
paths:
  /api/hubspot/access:
    get:
      tags:
      - Hubspot
      summary: Get Hubspot access token
      description: Generates or retrieves an access token for the Hubspot service. Requires the user to have Hubspot access permissions
      operationId: 8a141cd9dae1acaeee99c4b49f9d1295
      responses:
        '200':
          description: Generate or retrieve the Hubspot access token.
          content:
            application/json:
              schema:
                properties:
                  access_token:
                    type: string
                type: object
        '401':
          description: Unauthorized - Invalid or missing authentication token.
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      name: JWT Authentication
      in: header
      bearerFormat: JWT
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      description: 'Service API key for external services (ai-api, chat-api). Generate with: php artisan su:api-token:generate'
      name: X-API-Key
      in: header
