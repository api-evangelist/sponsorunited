openapi: 3.2.0
info:
  title: SponsorUnited Item Image API
  version: v1
  description: Item Image
tags:
- name: Item Image
  description: Item Image
paths:
  /api/item-image/{id}:
    delete:
      tags:
      - Item Image
      summary: Delete item image
      description: Removes an image associated with an item
      operationId: 8a57af116b799c629a48bc4793809363
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Empty response when deleted successfully.
        '400':
          description: Response with error.
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                    example: Could not find creative to delete
                type: object
        '404':
          description: Response with error.
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                    example: Could not find creative to delete
                type: object
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      name: JWT Authentication
      in: header
      bearerFormat: JWT
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      description: 'Service API key for external services (ai-api, chat-api). Generate with: php artisan su:api-token:generate'
      name: X-API-Key
      in: header
