openapi: 3.2.0
info:
  title: SponsorUnited Events API
  version: v1
  description: Events
tags:
- name: Events
  description: Events
paths:
  /api/events:
    get:
      tags:
      - Events
      summary: List all events
      description: Returns a list of all events (placeholder - will be replaced by teamEvents method)
      operationId: f03fc722854a9c744a79b16f6b27016c
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthenticated
      security:
      - bearerAuth: []
    post:
      tags:
      - Events
      summary: Create a new event
      description: Creates a new event with optional multiple events creation for consecutive seasons
      operationId: 74a3db86fa6f0a55e99bb5a3c9fd29a0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - hometeam_id
              - name
              properties:
                hometeam_id:
                  description: ID of the home team
                  type: integer
                awayteam_id:
                  description: ID of the away team (optional)
                  type: integer
                name:
                  description: Event name
                  type: string
                scheduled_date:
                  description: Scheduled date
                  type: string
                  format: date
                scheduled_time:
                  description: Scheduled time
                  type: string
                  format: time
                startDate:
                  description: Start date for multi-day events
                  type: string
                  format: date
                endDate:
                  description: End date for multi-day events
                  type: string
                  format: date
                venue:
                  description: Venue ID
                  type: integer
                event_type:
                  description: Type of event (e.g., social, single, multi, season)
                  type: string
                season:
                  description: Season year
                  type: integer
                status:
                  description: User event status
                  type: string
                  enum:
                  - assigned
                  - inprogress
                  - inreview
                  - rejected
                  - approved
                user_event_type:
                  description: User event type (defaults to Other if not specified)
                  type: string
                  enum:
                  - Other
                  - Venue
                  - Property
                  - TV
                  - Radio
                  - Digital
                  - Social
                  - Quick Add
                  - Print
                  - Steaming Audio
                  - Streaming Video
                  - Virtual Venue
                user_id:
                  description: User ID to assign the event to
                  type: integer
                eventsCount:
                  description: Number of events to create for consecutive seasons
                  type: integer
              type: object
      responses:
        '200':
          description: Event(s) created successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          description: Unauthenticated
        '422':
          description: Validation error
      security:
      - bearerAuth: []
  /api/events/team/{team_id}:
    get:
      tags:
      - Events
      summary: Get events for a specific property/team
      description: Returns a paginated list of events for a specific property/team with optional filtering by date, season, event type, and name
      operationId: 4644cb6c07f9c2b9482ee452e2bb9966
      parameters:
      - name: team_id
        in: path
        description: The ID of the team/property
        required: true
        schema:
          type: integer
      - name: skipSeasonal
        in: query
        description: Skip seasonal events (true/false)
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: order_by
        in: query
        description: Field to order by
        schema:
          type: string
          enum:
          - name
          - created_at
          - audits
          - venue
          - season
      - name: order
        in: query
        description: Order direction
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: startDate
        in: query
        description: Filter events starting from this date
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        description: Filter events ending at this date
        schema:
          type: string
          format: date
      - name: name
        in: query
        description: Filter by event name (partial match)
        schema:
          type: string
      - name: season
        in: query
        description: Filter by season(s) - JSON encoded array
        schema:
          type: string
      - name: event_type
        in: query
        description: Filter by event type(s) - JSON encoded array
        schema:
          type: string
      - name: eventId
        in: query
        description: Exclude a specific event by ID
        schema:
          type: integer
      - name: per_page
        in: query
        description: Number of results per page
        schema:
          type: integer
          default: 25
      - name: page
        in: query
        description: Page number
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: Paginated list of events
        '401':
          description: Unauthenticated
      security:
      - bearerAuth: []
  /api/events/property/all:
    get:
      tags:
      - Events
      summary: Get all events for a selected team
      description: Returns all events for a selected team with optional filtering by type, season, and date range
      operationId: e82f4dcfbf48d29b23c10433850410f9
      parameters:
      - name: selectedTeam
        in: query
        description: The ID of the selected team
        required: true
        schema:
          type: integer
      - name: type
        in: query
        description: Event type filter (e.g., 'season')
        schema:
          type: string
      - name: season
        in: query
        description: Filter by season
        schema:
          type: integer
      - name: continuous
        in: query
        description: Include multi-type events (true/false)
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: startDate
        in: query
        description: Filter events starting from this date
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        description: Filter events ending at this date
        schema:
          type: string
          format: date
      responses:
        '200':
          description: List of teams with their events
          content:
            application/json:
              schema:
                properties:
                  teams:
                    type: array
                    items:
                      type: object
                type: object
        '401':
          description: Unauthenticated
      security:
      - bearerAuth: []
  /api/event/{event_id}:
    get:
      tags:
      - Events
      summary: Get a specific event
      description: Returns details of a specific event including related teams, venue, sport, and user events
      operationId: 82f26619077a70eaccb304e3f69d483f
      parameters:
      - name: event_id
        in: path
        description: The ID of the event
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Event details
        '401':
          description: Unauthenticated
        '404':
          description: Event not found
      security:
      - bearerAuth: []
  /api/events/{event_id}:
    put:
      tags:
      - Events
      summary: Update an event
      description: Updates an existing event including scheduled times, dates, and event type
      operationId: d5605c8ea652015e39bba653eb03431e
      parameters:
      - name: event_id
        in: path
        description: The ID of the event to update
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - event_type
              - season
              properties:
                event_type:
                  description: Type of event
                  type: string
                  enum:
                  - season
                  - single
                  - multi
                  - social
                season:
                  description: Season year
                  type: integer
                scheduled_date:
                  description: Scheduled date (required for single events)
                  type: string
                  format: date
                scheduled_time:
                  description: Scheduled time (required for single events)
                  type: string
                  format: time
                startDate:
                  description: Start date (required for multi events)
                  type: string
                  format: date
                endDate:
                  description: End date (required for multi events)
                  type: string
                  format: date
                venue:
                  description: Venue ID
                  type: integer
                name:
                  description: Event name
                  type: string
              type: object
      responses:
        '200':
          description: Event updated successfully
        '400':
          description: Bad request - missing required fields for event type
        '401':
          description: Unauthenticated
        '404':
          description: Event not found
      security:
      - bearerAuth: []
    delete:
      tags:
      - Events
      summary: Delete an event
      description: Soft deletes an existing event
      operationId: 721867a307d87f7146694fa170a095f9
      parameters:
      - name: event_id
        in: path
        description: The ID of the event to delete
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Event deleted successfully
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: boolean
                    example: true
                type: object
        '400':
          description: Failed to delete event
        '401':
          description: Unauthenticated
        '404':
          description: Event not found
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      name: JWT Authentication
      in: header
      bearerFormat: JWT
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      description: 'Service API key for external services (ai-api, chat-api). Generate with: php artisan su:api-token:generate'
      name: X-API-Key
      in: header
