openapi: 3.2.0
info:
  title: SponsorUnited Intercom API
  version: v1
  description: Intercom
tags:
- name: Intercom
  description: Intercom
paths:
  /api/intercom/me:
    get:
      tags:
      - Intercom
      summary: Get current user Intercom info
      description: Returns the authenticated user's Intercom contact ID, company, and messenger token
      operationId: 1ffbb501d505c809a281c5afc3f10060
      responses:
        '200':
          description: ID, Intercom Company, and messenger token for the authenticated user
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                  company:
                    properties:
                      id:
                        type:
                        - string
                        - 'null'
                      name:
                        type:
                        - string
                        - 'null'
                    type: object
                  intercom_token:
                    type:
                    - string
                    - 'null'
                type: object
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      name: JWT Authentication
      in: header
      bearerFormat: JWT
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      description: 'Service API key for external services (ai-api, chat-api). Generate with: php artisan su:api-token:generate'
      name: X-API-Key
      in: header
