openapi: 3.2.0
info:
  title: SponsorUnited Tags API
  version: v1
  description: Tags
tags:
- name: Tags
  description: Tags
paths:
  /api/tags:
    get:
      tags:
      - Tags
      operationId: 3b8fd17c63dfdad4c49a9ce73fb0e066
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagIndexRequest'
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagIndexResource'
      security:
      - bearerAuth: []
      summary: 3b8fd17c63dfdad4c49a9ce73fb0e066
      x-summary-source: derived
  /api/tag:
    put:
      tags:
      - Tags
      operationId: c6e4cbd4c75b281bc0d18103137d8bc5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpdateRequest'
      responses:
        '200':
          description: The rename was successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResource'
      security:
      - bearerAuth: []
      summary: C6e4cbd4c75b281bc0d18103137d8bc5
      x-summary-source: derived
components:
  schemas:
    TagIndexResource:
      properties:
        id:
          type: integer
        name:
          type: string
      type: object
    TagResource:
      properties:
        id:
          type: integer
        name:
          type: string
      type: object
    TagUpdateRequest:
      properties:
        old_tag:
          type: string
        new_tag:
          type: string
      type: object
    TagIndexRequest:
      properties:
        search:
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      name: JWT Authentication
      in: header
      bearerFormat: JWT
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      description: 'Service API key for external services (ai-api, chat-api). Generate with: php artisan su:api-token:generate'
      name: X-API-Key
      in: header
