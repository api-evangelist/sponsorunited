  remediation: Not retryable. The caller's role or record ownership must change; see
    Roles & Permissions operations.
- status: 404
  title: Not Found
  occurrences: 122
  meaning: Addressed entity does not exist — "User not found", "Article not found",
    "Report not found", "Brand not found", "Organization not found".
  remediation: Not retryable. Re-resolve the identifier.
- status: 409
  title: Conflict
  occurrences: 2
  meaning: State conflict — "A scrape is already in progress for this entity"; "This
