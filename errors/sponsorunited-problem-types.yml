note: >-
  The API does not use RFC 9457 problem+json — no operation declares an
  application/problem+json response and the string "problem+json" does not appear in the
  spec. Errors are plain application/json. There is no single error envelope either: the
  contract mixes at least three shapes, which is the most consequential thing an agent
  needs to know here, because it cannot parse failures with one code path.
  No error reference documentation exists to enrich these titles — SponsorUnited publishes
  no developer docs — so every entry below is derived from the contract itself.
