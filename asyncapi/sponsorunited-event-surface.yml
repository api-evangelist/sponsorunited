note: >-
  SponsorUnited publishes no AsyncAPI document and offers its customers NO event surface.
  This artifact exists to record a distinction the raw counts would otherwise get wrong:
  the contract does contain five operations tagged or named "webhook", but every one of
  them is an INBOUND RECEIVER — an endpoint SponsorUnited exposes so that a third-party
  vendor or its own ingestion pipeline can POST a completion callback back to it. None of
  them lets a consumer subscribe to anything, there is no subscription-management
  operation anywhere in the contract, and there is no event catalog, delivery guarantee,
  retry policy or signature scheme published.
  Because of that, NO `Webhooks` pointer is emitted in apis.yml. The `webhooks_advertised`
  check asks whether the provider offers webhooks to its consumers, and SponsorUnited does
  not — crediting it for receiving vendor callbacks would misrepresent the API. An
  integrator wanting to know when a deal or brand record changes has to poll.
