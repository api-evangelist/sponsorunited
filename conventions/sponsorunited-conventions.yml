idempotency:
  mechanism: none
  idempotency_key_header: false
  grade: declared-semantic-only
  note: >-
    There is NO idempotency-key facility. The spec contains three references to
    idempotency and all three are prose statements that a particular operation happens to
    be idempotent by design, not a replay-safe mechanism the caller can invoke:
    DELETE /api/follows ("Entries that were never followed are silently ignored
    (idempotent)"), POST /api/vortex/user-event-notes ("Idempotent.") and
    POST /api/vortex/user-event-uploads ("Idempotent."). That is 3 of 547 operations.
    Every other write — including all resource creation — offers the caller no way to make
    a retry safe. Combined with the absence of Retry-After, an agent that retries a failed
    POST here can and will duplicate records. No `Idempotency` pointer is emitted in
    apis.yml, because the provider does not offer an idempotency facility and claiming one
    would misrepresent the API.
  idempotent_operations:
  - operationId: 69ef442f3509964dd78fead1e3ec3a2e
    operation: DELETE /api/follows
    basis: Documented — unfollowing an entity that was never followed is silently ignored.
  - operationId: 7688f9a0f9fc94c86a6f3aec6bb465c7
    operation: POST /api/vortex/user-event-notes
    basis: Documented — "Idempotent. Authenticated via X-API-Key."
  - operationId: 64882b86eec7c644fd28067f5e650665
    operation: POST /api/vortex/user-event-uploads
    basis: Documented — "Idempotent. Authenticated via X-API-Key."
dry_run_mode:
  supported: false
  note: No preview/simulate/validate-only parameter is declared on any write operation.
reversibility:
  grade: documented
  has_write_surface: true
  note: >-
    The API has a large write surface — 547 operations including creates, updates and
    deletes across users, brands, properties, reports, audits and news. Two explicit
    reversal operations exist and are the only ones in the contract. NEITHER states a
    window, and there is no documentation anywhere that states one, so this grades
    `documented` (a reversal path exists) and not `verified` (a path plus a stated
    window). No window is asserted here because none is published — inventing one could
    cost a user data.
  reversal_paths:
  - action: Delete a user
    reversal: POST /api/user/{id}/restore
    operationId: 392df502a617d3cb0bf5ca193553dc86
    summary: Restore deleted user
    window: null
    window_source: null
    note: Implies user deletion is a soft delete, but the retention period before the
      record becomes unrecoverable is not stated in the contract or anywhere else public.
  - action: Decline a news article
    reversal: PUT /api/news/article/{id}/restore
    operationId: 70198b0ef22aa7c8bbfd9ea52ea615c8
    summary: Restore a declined news article
    window: null
    window_source: null
  irreversible:
    note: >-
      Every other DELETE in the contract — agencies, assets, asset groupings and
      subgroupings, agency services, custom reports, saved reports, notes, contacts,
      tasks and more — declares no corresponding restore operation. An agent must treat
      those as permanent.
