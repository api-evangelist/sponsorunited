auth_style:
  primary: Bearer JWT in the Authorization header (securityScheme bearerAuth).
  secondary: X-API-Key header (securityScheme apiKeyAuth), described in the spec as a
    "Service API key for external services (ai-api, chat-api)".
  oauth2: false
  scopes: none
  note: 527 of 547 operations declare security. Because there is no OAuth2 flow there is
    no scope surface, so no scopes/ artifact is emitted.
  mfa: Login is a two-step flow — POST /api/auth/login, then GET /api/auth/pin/send/{mfaOption}
    and POST /api/auth/pin/verify.
  see: authentication/sponsorunited-authentication.yml
pagination:
  styles:
  - style: page-number
    params:
      page: Page number (integer, default 1)
      per_page: Items per page (integer, default 10)
    response_fields:
    - data
    - current_page
    - last_page
    - per_page
    - total
    - first_page_url
    - last_page_url
    - next_page_url
    - prev_page_url
    note: The Laravel length-aware paginator envelope. next_page_url is nullable and is
      the reliable "more pages" signal.
  - style: cursor
    params:
      after_id: 'Cursor: return records with id greater than this value. Omit for the
        first page.'
    note: Used on a minority of list operations; monotonic integer id cursor.
  consistency: mixed — page/per_page dominates, after_id appears on a handful of
    endpoints, and some list operations declare neither.
