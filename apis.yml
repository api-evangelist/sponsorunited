apis:
- name: SponsorUnited API
  description: 'The production REST API behind the SponsorUnited platform. Its OpenAPI
    3.0 description is publicly served at https://api.sponsorunited.com/docs and
    describes 547 operations across 422 paths and 561 schemas, covering brands,
    properties, leagues, agencies, events, contacts, deals and spend tracking, saved
    and custom reports, scouting audits, social scraping, news, user and organization
    management, and the Surface AI assistant. Authentication is a bearer JWT for
    platform users plus an X-API-Key service key for internal services. SponsorUnited
    publishes no developer documentation, reference site or sign-up path for this API.'
