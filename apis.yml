aid: sponsorunited
name: SponsorUnited
description: 'SponsorUnited is a sports and entertainment sponsorship intelligence
  platform, founded in 2018 and headquartered in Stamford, Connecticut. Its B2B SaaS
  product gives brands, rights holders (teams, leagues, venues and events), agencies
  and media companies a searchable dataset of marketing partnerships — the company
  reports 403,000+ brands, 2.2M+ tracked deals and 21.1M+ data points across sports,
  entertainment, media and talent — used to discover, evaluate, price, negotiate and
  activate sponsorships. The platform (SponsorUnited 4.0) layers AI features on that
  dataset, including the Surface AI analyst, a Proposal Evaluator, and SPND
  (Sponsorship Price of Negotiated Deals), a pricing-transparency product built on
  verified deal data. SponsorUnited runs a production REST API at
  api.sponsorunited.com whose OpenAPI 3.0 description is publicly served, but it
  publishes no developer portal, API reference or partner program around it; access
  is sold as a paid subscription with custom pricing and no self-serve sign-up.'
